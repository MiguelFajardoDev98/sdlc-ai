[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo_list"
version = "1.0.0"
description = "Aplicación de Lista de Tareas con Grafo de Dependencias, Persistencia JSON y Dashboard Web en Español (stdlib)"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.pylint.main]
source-roots = ["src"]
